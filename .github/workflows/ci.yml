name: CI

on:
   push:
      branches: [main, develop]
   pull_request:
      branches: [main, develop]

jobs:
   quality:
      name: Lint · Type-check · Build · Test
      runs-on: ubuntu-latest
      defaults:
         run:
            working-directory: client-pulsefit
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 10

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: '20'
              cache: 'pnpm'
              cache-dependency-path: client-pulsefit/pnpm-lock.yaml

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Lint
           run: pnpm lint

         - name: Type-check
           run: pnpm type-check

         - name: Unit tests
           run: pnpm test

         - name: Build
           run: pnpm build
           env:
              VITE_SUPABASE_URL: http://127.0.0.1:54321
              VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
              VITE_APP_ENV: production

   e2e:
      name: Playwright E2E
      runs-on: ubuntu-latest
      needs: quality
      defaults:
         run:
            working-directory: client-pulsefit
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 10

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: '20'
              cache: 'pnpm'
              cache-dependency-path: client-pulsefit/pnpm-lock.yaml

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Install Playwright browsers
           run: pnpm exec playwright install --with-deps chromium

         - name: Run E2E (chromium mobile)
           run: pnpm exec playwright test --project=mobile-chrome
           env:
              VITE_SUPABASE_URL: http://127.0.0.1:54321
              VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
              VITE_APP_ENV: development

         - name: Upload Playwright report on failure
           if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: playwright-report
              path: client-pulsefit/playwright-report/
              retention-days: 7
